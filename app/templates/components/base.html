<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog Platform{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand navbar-light bg-white shadow-sm px-4">
        <a href="/" class="navbar-brand">🚀 Blog Platform</a>
        <div class="ms-auto">
            <a href="/" class="btn btn-link">Inicio</a>
            <a href="/login" class="btn btn-link">Login</a>
            <a href="/register" class="btn btn-link">Registro</a>
            <a href="/posts/create" class="btn btn-primary btn-sm">Nueva publicación</a>
        </div>
    </nav>
    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
