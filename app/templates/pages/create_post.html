{% extends "components/base.html" %}
{% block title %}Nueva publicación — Blog Platform{% endblock %}
{% block content %}
<h1 class="mb-4">Nueva publicación</h1>
<div id="auth-warning" class="alert alert-warning d-none">
    Necesitás <a href="/login">iniciar sesión</a> para publicar.
</div>
<form id="create-post-form" class="col-md-6">
    <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" id="title" class="form-control" required minlength="3">
    </div>
    <div class="mb-3">
        <label class="form-label">Contenido</label>
        <textarea id="content" class="form-control" rows="6" required minlength="5"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Publicar</button>
</form>
<div id="create-result" class="mt-3"></div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", () => {
    const token = localStorage.getItem("access_token");
    if (!token) {
        document.getElementById("auth-warning").classList.remove("d-none");
        document.getElementById("create-post-form").classList.add("d-none");
    }
});

document.getElementById("create-post-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const resultDiv = document.getElementById("create-result");
    const token = localStorage.getItem("access_token");
    const payload = {
        title: document.getElementById("title").value,
        content: document.getElementById("content").value,
    };

    try {
        const res = await fetch("/api/v1/posts/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token,
            },
            body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) {
            resultDiv.innerHTML = `<div class="alert alert-danger">${data.detail || "Error al publicar"}</div>`;
            return;
        }
        resultDiv.innerHTML = `<div class="alert alert-success">¡Publicado! Redirigiendo al inicio...</div>`;
        setTimeout(() => window.location.href = "/", 800);
    } catch (err) {
        resultDiv.innerHTML = `<div class="alert alert-danger">Error de conexión</div>`;
    }
});
</script>
{% endblock %}
