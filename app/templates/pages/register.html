{% extends "components/base.html" %}
{% block title %}Registrarse — Blog Platform{% endblock %}
{% block content %}
<h1 class="mb-4">Crear cuenta</h1>
<form id="register-form" class="col-md-4">
    <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" id="username" class="form-control" required minlength="3">
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" required minlength="8">
    </div>
    <button type="submit" class="btn btn-primary">Registrarme</button>
</form>
<div id="register-result" class="mt-3"></div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const resultDiv = document.getElementById("register-result");
    const payload = {
        username: document.getElementById("username").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
    };

    try {
        const res = await fetch("/api/v1/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) {
            resultDiv.innerHTML = `<div class="alert alert-danger">${data.detail || "Error al registrarse"}</div>`;
            return;
        }
        resultDiv.innerHTML = `<div class="alert alert-success">Cuenta creada. Redirigiendo al login...</div>`;
        setTimeout(() => window.location.href = "/login", 1000);
    } catch (err) {
        resultDiv.innerHTML = `<div class="alert alert-danger">Error de conexión</div>`;
    }
});
</script>
{% endblock %}
