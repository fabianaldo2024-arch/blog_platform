{% extends "components/base.html" %}
{% block title %}Iniciar sesión — Blog Platform{% endblock %}
{% block content %}
<h1 class="mb-4">Iniciar sesión</h1>
<form id="login-form" class="col-md-4">
    <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" name="username" id="username" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" id="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Ingresar</button>
</form>
<div id="login-result" class="mt-3"></div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const resultDiv = document.getElementById("login-result");
    const body = new URLSearchParams();
    body.append("username", document.getElementById("username").value);
    body.append("password", document.getElementById("password").value);

    try {
        const res = await fetch("/api/v1/auth/token", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: body,
        });
        const data = await res.json();
        if (!res.ok) {
            resultDiv.innerHTML = `<div class="alert alert-danger">${data.detail || "Error al iniciar sesión"}</div>`;
            return;
        }
        localStorage.setItem("access_token", data.access_token);
        resultDiv.innerHTML = `<div class="alert alert-success">¡Bienvenido! Redirigiendo...</div>`;
        setTimeout(() => window.location.href = "/", 800);
    } catch (err) {
        resultDiv.innerHTML = `<div class="alert alert-danger">Error de conexión</div>`;
    }
});
</script>
{% endblock %}
