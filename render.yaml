databases:
  - name: blog-db
    databaseName: blog_db
    user: blog_user
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: blog-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blog-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"